<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin:0; padding:20px; background:var(--bg-base); width:700px; box-sizing:border-box; color:var(--text-secondary); }
  .row { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  .box { border:1px solid var(--border-subtle); display:flex; align-items:center; justify-content:center; height:56px; font-family:var(--font-mono); font-size:11px; color:var(--text-muted); background:var(--bg-surface); }
</style></head>
<body>
<div class="row">
  <div class="box" style="border-radius:8px">sm · 8px</div>
  <div class="box" style="border-radius:12px">md · 12px</div>
  <div class="box" style="border-radius:16px">lg · 16px</div>
  <div class="box" style="border-radius:20px">xl · 20px</div>
</div>
<p style="margin-top:16px;font-size:11px;color:var(--text-muted)">sm: chips/badges · md: inputs/buttons · lg: cards · xl: modals</p>
</body></html>

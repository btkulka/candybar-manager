<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin:0; padding:24px; background:var(--bg-base); width:700px; box-sizing:border-box; }
  .row { display:flex; justify-content:space-between; align-items:baseline; padding:6px 0; border-bottom:1px solid var(--border-subtle); }
  .row:last-child { border:none; }
  .tok { font-family:var(--font-mono); color:var(--text-muted); font-size:11px; }
</style></head>
<body>
<div class="row"><span style="font-size:.875rem;color:var(--text-primary)">Body · The source bin has 412 tracks ready to organize.</span><span class="tok">--fs-body · fg1</span></div>
<div class="row"><span style="font-size:.875rem;color:var(--text-secondary)">Secondary · fg2 line-height 1.5</span><span class="tok">fg2</span></div>
<div class="row"><span style="font-size:.80rem;color:var(--text-muted)">Small · 0 tracks · 0 healthy</span><span class="tok">--fs-small · fg3</span></div>
<div class="row"><span style="font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)">EYEBROW · CONNECTED</span><span class="tok">--fs-nano · accent</span></div>
<div class="row"><span style="font-family:var(--font-mono);font-size:.8rem;color:var(--text-secondary);background:rgba(0,0,0,.3);padding:2px 6px;border-radius:4px">/Users/you/Music/Inbox</span><span class="tok">mono</span></div>
</body></html>

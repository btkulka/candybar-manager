<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body {
    margin: 0; padding: 32px; background: var(--bg-base); width: 760px; box-sizing: border-box;
    font-family: var(--font-sans); color: var(--text-primary);
  }
  .group {
    display: flex; gap: 14px; flex-wrap: wrap; align-items: center;
    padding: 22px 0; border-bottom: 1px solid var(--border-subtle);
  }
  .group:last-child { border: none; }
  .lbl {
    font-family: var(--font-mono); font-size: 10px; letter-spacing: .16em;
    text-transform: uppercase; color: var(--text-muted); width: 100%;
    margin-bottom: 4px;
  }

  /* Base button — every variant inherits raised dimension */
  .btn {
    position: relative;
    font-family: inherit; font-size: .875rem; font-weight: 500;
    padding: 10px 18px; border-radius: var(--radius-md);
    border: 1px solid transparent;
    cursor: pointer;
    transition: transform .12s var(--ease-out), box-shadow .2s var(--ease-out), background .2s var(--ease-out);
    display: inline-flex; align-items: center; gap: 8px;
    letter-spacing: -.005em;
    isolation: isolate;
  }
  .btn:active { transform: translateY(1px); }

  /* PRIMARY — gradient fill + inset top highlight + outer ring glow + soft ground shadow */
  .btn-primary {
    color: #05090c;
    font-weight: 600;
    background:
      linear-gradient(180deg, #a8ffe2 0%, #7fffd4 55%, #5ee0b6 100%);
    border-color: rgba(0, 0, 0, .35);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, .55),
      inset 0 -1px 0 rgba(0, 0, 0, .18),
      0 1px 0 rgba(255, 255, 255, .04),
      0 6px 14px -4px rgba(0, 0, 0, .6),
      0 0 0 1px rgba(127, 255, 212, .12),
      0 0 22px -2px rgba(127, 255, 212, .28);
    text-shadow: 0 1px 0 rgba(255, 255, 255, .25);
  }
  .btn-primary:hover {
    background: linear-gradient(180deg, #b8ffe9 0%, #8cffdc 55%, #6ae8c2 100%);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, .7),
      inset 0 -1px 0 rgba(0, 0, 0, .2),
      0 8px 20px -4px rgba(0, 0, 0, .65),
      0 0 0 1px rgba(127, 255, 212, .25),
      0 0 32px -2px rgba(127, 255, 212, .5);
  }
  .btn-primary:active {
    background: linear-gradient(180deg, #7fffd4 0%, #6be5c0 100%);
    box-shadow:
      inset 0 1px 2px rgba(0, 0, 0, .35),
      inset 0 -1px 0 rgba(255, 255, 255, .15),
      0 1px 0 rgba(255, 255, 255, .05),
      0 0 16px -2px rgba(127, 255, 212, .2);
  }

  /* SECONDARY — raised dark surface w/ inset highlight ring */
  .btn-secondary {
    color: var(--text-primary);
    background: linear-gradient(180deg, #1b1f24 0%, #0f1216 100%);
    border-color: rgba(255, 255, 255, .06);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, .08),
      inset 0 -1px 0 rgba(0, 0, 0, .5),
      0 2px 0 rgba(0, 0, 0, .4),
      0 6px 14px -6px rgba(0, 0, 0, .8);
  }
  .btn-secondary:hover {
    background: linear-gradient(180deg, #22272d 0%, #14181d 100%);
    border-color: rgba(255, 255, 255, .12);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, .12),
      inset 0 -1px 0 rgba(0, 0, 0, .55),
      0 3px 0 rgba(0, 0, 0, .45),
      0 10px 22px -8px rgba(0, 0, 0, .9),
      0 0 0 1px rgba(127, 255, 212, .1);
  }
  .btn-secondary:active {
    background: linear-gradient(180deg, #0e1116 0%, #14181d 100%);
    box-shadow:
      inset 0 1px 2px rgba(0, 0, 0, .6),
      inset 0 -1px 0 rgba(255, 255, 255, .04);
  }

  /* GHOST — no surface until hover, but still has pressable feedback */
  .btn-ghost {
    color: var(--text-secondary);
    background: transparent;
    border-color: transparent;
  }
  .btn-ghost:hover {
    color: var(--text-primary);
    background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.01));
    border-color: rgba(255, 255, 255, .06);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, .05),
      0 4px 10px -6px rgba(0, 0, 0, .5);
  }

  /* DANGER — red gradient, inset highlight, glow */
  .btn-danger {
    color: #fff;
    font-weight: 600;
    background: linear-gradient(180deg, #ff6b5e 0%, #e74c3c 55%, #c0392b 100%);
    border-color: rgba(0, 0, 0, .4);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, .35),
      inset 0 -1px 0 rgba(0, 0, 0, .25),
      0 6px 14px -4px rgba(0, 0, 0, .55),
      0 0 0 1px rgba(231, 76, 60, .18),
      0 0 22px -6px rgba(231, 76, 60, .55);
    text-shadow: 0 1px 0 rgba(0, 0, 0, .25);
  }
  .btn-danger:hover {
    background: linear-gradient(180deg, #ff7b6e 0%, #ef5644 55%, #ce3e2d 100%);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, .4),
      0 8px 20px -4px rgba(0, 0, 0, .6),
      0 0 0 1px rgba(231, 76, 60, .3),
      0 0 30px -4px rgba(231, 76, 60, .7);
  }

  .btn-sm { padding: 7px 12px; font-size: .78rem; border-radius: var(--radius-sm); }

  /* ICON BUTTON — subtle dimpled well on hover */
  .btn-icon {
    width: 34px; height: 34px; padding: 0;
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent; color: var(--text-secondary);
    border: 1px solid transparent; border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all .15s var(--ease-out);
  }
  .btn-icon:hover {
    background: linear-gradient(180deg, rgba(0,0,0,.35), rgba(0,0,0,.15));
    border-color: rgba(255,255,255,.05);
    color: var(--text-primary);
    box-shadow:
      inset 0 1px 2px rgba(0,0,0,.5),
      inset 0 -1px 0 rgba(255,255,255,.04);
  }
  .btn-icon:active {
    box-shadow: inset 0 2px 4px rgba(0,0,0,.7);
  }

  /* FAB-style primary — for rare, hero actions */
  .btn-fab {
    width: 48px; height: 48px; padding: 0;
    border-radius: 50%;
    color: #05090c;
    background: radial-gradient(circle at 35% 30%, #c8ffed 0%, #7fffd4 45%, #4dd4b0 100%);
    border: 1px solid rgba(0, 0, 0, .5);
    box-shadow:
      inset 0 2px 0 rgba(255, 255, 255, .55),
      inset 0 -2px 4px rgba(0, 0, 0, .25),
      0 10px 24px -6px rgba(0, 0, 0, .8),
      0 0 0 1px rgba(127, 255, 212, .2),
      0 0 30px -4px rgba(127, 255, 212, .55);
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: all .18s var(--ease-out);
  }
  .btn-fab:hover { transform: translateY(-1px); box-shadow: inset 0 2px 0 rgba(255,255,255,.7), 0 14px 28px -6px rgba(0,0,0,.85), 0 0 36px -2px rgba(127,255,212,.7); }
  .btn-fab:active { transform: translateY(1px); }

  svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .btn-fab svg { width: 18px; height: 18px; }

  /* Loading primary — subtle shimmer across the face */
  .btn-loading {
    color: rgba(5, 9, 12, .6);
    overflow: hidden;
  }
  .btn-loading::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,.35) 50%, transparent 100%);
    transform: translateX(-100%);
    animation: shimmer 1.4s infinite;
    pointer-events: none;
  }
  @keyframes shimmer { to { transform: translateX(100%); } }
</style></head>
<body>

  <div class="group">
    <div class="lbl">Primary · secondary · ghost · danger</div>
    <button class="btn btn-primary">Scan missing</button>
    <button class="btn btn-secondary">Browse</button>
    <button class="btn btn-ghost">Cancel</button>
    <button class="btn btn-danger">Delete</button>
  </div>

  <div class="group">
    <div class="lbl">Small · with icon · loading</div>
    <button class="btn btn-primary btn-sm">
      <svg viewBox="0 0 24 24"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>
      Retry failed
    </button>
    <button class="btn btn-secondary btn-sm">
      <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Export JSON
    </button>
    <button class="btn btn-primary btn-loading btn-sm">Working…</button>
  </div>

  <div class="group">
    <div class="lbl">Icon buttons · floating action</div>
    <button class="btn-icon" title="Delete">
      <svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
    </button>
    <button class="btn-icon" title="More">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
    </button>
    <button class="btn-icon" title="Search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    </button>
    <div style="width: 24px"></div>
    <button class="btn-fab" title="Start">
      <svg viewBox="0 0 24 24"><polygon points="6 4 20 12 6 20 6 4" fill="currentColor" stroke="none"/></svg>
    </button>
  </div>

</body></html>

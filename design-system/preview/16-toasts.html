<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin:0; padding:20px; background:var(--bg-base); width:700px; box-sizing:border-box; font-family:var(--font-sans); display:flex; flex-direction:column; gap:10px; }
  .toast { display:flex; align-items:center; gap:12px; padding:12px 16px; background:var(--bg-surface); border:1px solid var(--border-subtle); border-radius:var(--radius-md); box-shadow:var(--shadow-md); }
  .toast-icon { width:20px; height:20px; flex-shrink:0; }
  .toast-msg { font-size:.875rem; color:var(--text-primary); }
  .toast-success { border-color:rgba(29,185,84,.3); }
  .toast-success .toast-icon { color:#1db954; }
  .toast-error { border-color:rgba(231,76,60,.3); }
  .toast-error .toast-icon { color:#e74c3c; }
  .toast-warning { border-color:rgba(241,196,15,.3); }
  .toast-warning .toast-icon { color:#f1c40f; }
  .toast-info { border-color:var(--border-accent); }
  .toast-info .toast-icon { color:var(--accent); }
  svg { width:100%; height:100%; stroke:currentColor; stroke-width:2; fill:none; stroke-linecap:round; stroke-linejoin:round; }
</style></head>
<body>
<div class="toast toast-success"><div class="toast-icon"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div><div class="toast-msg">Library imported · 1,284 tracks</div></div>
<div class="toast toast-warning"><div class="toast-icon"><svg viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/></svg></div><div class="toast-msg">31 tracks are missing artist tags</div></div>
<div class="toast toast-error"><div class="toast-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg></div><div class="toast-msg">Beatport sign-in failed · retry</div></div>
<div class="toast toast-info"><div class="toast-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="8"/></svg></div><div class="toast-msg">New Rekordbox export detected</div></div>
</body></html>

<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin:0; padding:20px; background:var(--bg-base); width:700px; box-sizing:border-box; }
  .row { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .sw { aspect-ratio: 1.6; border-radius: 10px; padding:10px; display:flex; flex-direction:column; justify-content:space-between; border:1px solid var(--border-subtle); font-size:11px; }
  .sw code { background:transparent; padding:0; color:inherit; font-size:10px; }
  .lbl { font-weight:600; color:var(--text-primary); font-size:12px; }
  .val { font-family:var(--font-mono); color:var(--text-muted); }
</style></head>
<body>
<div class="row">
  <div class="sw" style="background:#05090c"><span class="lbl">bg-base</span><span class="val">#05090c</span></div>
  <div class="sw" style="background:#0a1014"><span class="lbl">bg-elevated</span><span class="val">#0a1014</span></div>
  <div class="sw" style="background:#0f161c"><span class="lbl">bg-surface</span><span class="val">#0f161c</span></div>
  <div class="sw" style="background:#141d24"><span class="lbl">bg-surface-hover</span><span class="val">#141d24</span></div>
</div>
</body></html>

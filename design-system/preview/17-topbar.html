<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin:0; padding:0; background:var(--bg-base); width:700px; box-sizing:border-box; font-family:var(--font-sans); color:var(--text-primary); }
  .topbar { height:40px; background:var(--bg-elevated); border-bottom:1px solid var(--border-subtle); display:flex; align-items:center; padding:0 16px; gap:16px; }
  .brand { display:flex; align-items:center; gap:8px; font-weight:700; font-size:.9rem; letter-spacing:-.01em; }
  .brand svg { width:20px; height:20px; }
  .nav { display:flex; gap:4px; margin-left:16px; }
  .nav-link { padding:6px 12px; font-size:.8rem; color:var(--text-secondary); border-radius:var(--radius-sm); cursor:pointer; }
  .nav-link.active { color:var(--accent); background:var(--accent-muted); }
  .spacer { flex:1; }
  .pills { display:flex; gap:6px; }
  .pill { display:inline-flex; align-items:center; gap:6px; padding:4px 10px; font-size:.7rem; border-radius:999px; border:1px solid var(--border-subtle); }
  .spotify { color:#1db954; border-color:rgba(29,185,84,.4); background:rgba(29,185,84,.09); }
  .beatport { color:#a4ff00; border-color:rgba(164,255,0,.4); background:rgba(164,255,0,.09); }
  .dot { width:6px; height:6px; border-radius:50%; background:currentColor; }
</style></head>
<body>
<div class="topbar">
  <div class="brand"><svg viewBox="0 0 32 32" fill="none" stroke-width="2"><rect x="3" y="3" width="26" height="26" rx="6" fill="rgba(127,255,212,0.15)" stroke="rgba(127,255,212,0.5)"/><circle cx="16" cy="16" r="7" fill="none" stroke="#7fffd4"/><circle cx="16" cy="16" r="2" fill="#7fffd4"/></svg>Track Lab</div>
  <div class="nav">
    <span class="nav-link active">Library</span><span class="nav-link">Organize</span><span class="nav-link">Check</span><span class="nav-link">Sources</span><span class="nav-link">USB</span><span class="nav-link">Restore</span>
  </div>
  <div class="spacer"></div>
  <div class="pills"><span class="pill spotify"><span class="dot"></span>Spotify</span><span class="pill beatport"><span class="dot"></span>Beatport</span></div>
</div>
</body></html>

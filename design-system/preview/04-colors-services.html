<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin:0; padding:20px; background:var(--bg-base); width:700px; box-sizing:border-box; }
  .row { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .sw { aspect-ratio:1.6; border-radius:10px; padding:10px; display:flex; flex-direction:column; justify-content:space-between; font-size:11px; font-weight:600; }
  .val { font-family:var(--font-mono); font-size:10px; opacity:.75; }
</style></head>
<body>
<div class="row">
  <div class="sw" style="background:rgba(29,185,84,0.09);color:#1db954;border:1px solid rgba(29,185,84,0.4)"><span>Spotify</span><span class="val">#1db954</span></div>
  <div class="sw" style="background:rgba(255,85,0,0.09);color:#ff5500;border:1px solid rgba(255,85,0,0.4)"><span>SoundCloud</span><span class="val">#ff5500</span></div>
  <div class="sw" style="background:rgba(100,140,255,0.09);color:#7aa7ff;border:1px solid rgba(100,140,255,0.4)"><span>Qobuz</span><span class="val">#5e87ff</span></div>
  <div class="sw" style="background:rgba(164,255,0,0.09);color:#a4ff00;border:1px solid rgba(164,255,0,0.4)"><span>Beatport</span><span class="val">#a4ff00</span></div>
</div>
</body></html>

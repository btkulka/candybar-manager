<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin:0; padding:24px; background:var(--bg-base); width:700px; box-sizing:border-box; color:var(--text-primary); font-family:var(--font-sans); }
  .row { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  .cell { background:var(--bg-surface); border:1px solid var(--border-subtle); border-radius:12px; height:80px; display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:11px; color:var(--text-muted); }
</style></head>
<body>
<div class="row">
  <div class="cell" style="box-shadow:0 2px 8px rgba(0,0,0,0.4)">shadow-sm</div>
  <div class="cell" style="box-shadow:0 8px 24px rgba(0,0,0,0.5)">shadow-md</div>
  <div class="cell" style="box-shadow:0 16px 48px rgba(0,0,0,0.6)">shadow-lg</div>
</div>
<div class="row" style="margin-top:16px">
  <div class="cell" style="background:#7fffd4;color:#05090c;box-shadow:0 2px 8px rgba(0,0,0,0.4),0 0 20px rgba(127,255,212,0.3);border:none">shadow-glow · primary CTA</div>
  <div class="cell" style="grid-column:span 2">Reserved: toasts, modals, drawer, primary CTA only</div>
</div>
</body></html>

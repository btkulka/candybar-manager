<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin:0; padding:20px; background:var(--bg-base); width:700px; box-sizing:border-box; color:var(--text-secondary); font-family:var(--font-sans); font-size:12px; }
  .row { display:grid; grid-template-columns:repeat(8,1fr); gap:8px; align-items:end; }
  .cell { display:flex; flex-direction:column; align-items:center; gap:4px; }
  .box { background:var(--accent); border-radius:4px; }
  .tok { font-family:var(--font-mono); font-size:10px; color:var(--text-muted); }
</style></head>
<body>
<div class="row">
  <div class="cell"><div class="box" style="width:4px;height:4px"></div><span class="tok">xs 4</span></div>
  <div class="cell"><div class="box" style="width:8px;height:8px"></div><span class="tok">sm 8</span></div>
  <div class="cell"><div class="box" style="width:12px;height:12px"></div><span class="tok">md 12</span></div>
  <div class="cell"><div class="box" style="width:16px;height:16px"></div><span class="tok">lg 16</span></div>
  <div class="cell"><div class="box" style="width:20px;height:20px"></div><span class="tok">xl 20</span></div>
  <div class="cell"><div class="box" style="width:24px;height:24px"></div><span class="tok">2xl 24</span></div>
  <div class="cell"><div class="box" style="width:32px;height:32px"></div><span class="tok">3xl 32</span></div>
  <div class="cell"><div class="box" style="width:48px;height:48px"></div><span class="tok">4xl 48</span></div>
</div>
<p style="margin-top:20px;font-size:11px;color:var(--text-muted)">4px grid · semantic aliases --pad-card, --gap-stack, --gap-inline</p>
</body></html>

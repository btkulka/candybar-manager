# Packaged Track Lab: a .dmg per Mac architecture, built by
# .github/workflows/release.yml and attached to a GitHub Release.
#
#   npm run dist        # both dmgs into release/
#
# electron-builder recompiles better-sqlite3 in this checkout's node_modules
# for each target arch, so building the Intel dmg on Apple silicon leaves an
# Intel binary behind; `npm run dist` runs `npm run rebuild` afterwards to put
# this Mac's back. Run electron-builder directly and you must do that yourself.
#
# The checkout install (scripts/install.sh) doesn't use any of this.
appId: com.btkulka.tracklab
productName: Track Lab
directories:
  output: release
  buildResources: assets

# Unpacked: lib/ and bin/ are ES modules the app imports and runs on Electron's
# Node, and lib/ holds Python scripts and ffmpeg is spawned from node_modules,
# none of which can be read from inside an asar archive.
asar: false

# A whitelist, so nothing personal at the repo root (secrets.json, a stray
# config.json) can ride along.
files:
  - package.json
  - requirements-rbx.txt
  - dist/**
  - lib/**
  - bin/**
  # Track Lab's Claude skills (a plugin its Claude jobs load with --plugin-dir).
  - claude-plugin/**
  - "!claude-plugin/**/evals/**"
  - assets/**
  - "!**/__tests__/**"
  - "!lib/rekordbox/tests/**"
  - "!**/*.{test,spec}.{js,mjs,ts}"
  - "!**/__pycache__/**"
  - "!node_modules/ffprobe-static/bin/{linux,win32}/**"

# Swaps in the right ffmpeg/ffprobe for each architecture.
afterPack: scripts/after-pack.cjs

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  icon: assets/AppIcon.icns
  category: public.app-category.music
  # No Developer ID yet, so electron-builder doesn't sign; after-pack.cjs signs
  # ad-hoc instead. Left unsigned, Apple silicon calls a downloaded app
  # "damaged" with no way to open it; ad-hoc gets "Open Anyway" in System
  # Settings. With a Developer ID, set it here and drop the ad-hoc step.
  identity: null
  hardenedRuntime: false
  extendInfo:
    NSAppleEventsUsageDescription: Track Lab asks Finder and Rekordbox to open files and folders for you.

dmg:
  artifactName: Track-Lab-${version}-${arch}.${ext}
